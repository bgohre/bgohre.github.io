name: Restore episode audio with correct filenames
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-eps-3-5
      - name: Restore episode audio files with correct filenames
        run: |
          set -e
          git config user.name "bgohre"
          git config user.email "Barbara.gohre@gmail.com"
          git show f1937b4:coast-to-coast-gme/audio/coast-to-coast-gme-ep-3-leading-from-wherever-you-sit-2026-10-01-v6.mp3 > coast-to-coast-gme/audio/ep3-leading-from-wherever-you-sit.mp3
          git show f1937b4:coast-to-coast-gme/audio/coast-to-coast-gme-ep-4-the-job-description-that-never-matches-the-job-2026-10-01-v5.mp3 > coast-to-coast-gme/audio/ep4-the-job-description-that-never-matches-the-job.mp3
          git show f1937b4:coast-to-coast-gme/audio/coast-to-coast-gme-ep-5-field-notes-issue-01-2026-10-01-v5.mp3 > coast-to-coast-gme/audio/ep5-field-notes-issue-01.mp3
          ls -l coast-to-coast-gme/audio/ep*.mp3
          git add coast-to-coast-gme/audio/
          git commit -m "Restore episode 3-5 audio with correct filenames" || echo "nothing to commit"
          git push origin publish-eps-3-5
